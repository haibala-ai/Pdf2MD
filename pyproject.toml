[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2md-pipeline"
version = "0.1.0"
description = "Local PDF to Markdown with structural checks and original-page evidence"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mineru==4.0.12",
    "pypdf==6.21.2",
    "markdown-it-py==4.2.0",
    "pypdfium2==5.14.0",
]

[project.scripts]
pdf2md = "pdf2md.pipeline:main"

[project.urls]
Repository = "https://github.com/haibala-ai/Pdf2MD"
Issues = "https://github.com/haibala-ai/Pdf2MD/issues"

[tool.setuptools.packages.find]
where = ["src"]
